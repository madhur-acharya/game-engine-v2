<html lang= "en">
<head>
	<title> Game Engine v2</title>
	<meta charset= "UTF-8">
<style>
	body{padding: 0; margin: 0;}
	#my_canvas{border: 0px; padding: 0px; margin: 0px;}
	#framerate{position: fixed; top: 0px; left: 0px; z-index: 2; color: white;}
	#nurdy_stats{position: fixed; top: 0px; left: 50%; z-index: 2; color: white;}
	#nurdy_stats1{position: fixed; top: 0px; left: 25%; z-index: 2; color: white;}
	#nurdy_stats2{position: fixed; top: 0px; left: 70%; z-index: 2; color: white;}
	#nurdy_stats3{position: fixed; top: 0px; left: 0px; z-index: 2; color: white;}
	#nurdy_stats4{position: fixed; top: 0px; right: 0px; z-index: 2; color: white;}

	main{
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		overflow: hidden;
		display: flex;
		align-items: center;
		justify-content: center;
		width: 100%;
		height: 100%;
	}
	#my_canvas{
		width: 100%;
		height: 80%;
	}
	#tilepicker{
		padding: 10px;
		border: 5px solid grey;
		width: 100%;
		height: 20%;
	}
	#leftbar{
		width: 20%;
		padding: 10px;
		border: 5px solid grey;
		height: 100%;
	}
	#rightbar{
		width: 80%;
		display: flex;
		flex-direction: column;
		height: 100%;
		width: 100%;
	}
</style>
</head>
<body>
	<p id= "framerate"></p>
	<pre id= "nurdy_stats" ></pre>
	<pre id= "nurdy_stats4" ></pre>
	<main>
		<div id="leftbar"></div>
		<div id="rightbar">
			<canvas id= "my_canvas" > whoops!!!</canvas>
			<div id="tilepicker"></div>
		</div>
	</main>
	</div>

	<script type= "module" src= "tileEditor/main.js"></script>

</body>
</html>
